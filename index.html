<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    

    <nav class="navbar">
    <a href="index.html" class="nav-logo">STUDENT HUB</a>
    <div class="nav-links">
        <div class="settings-menu">
    <button id="settingsMenuBtn" class="settings-menu-btn">
        <span>Settings</span>
    </button>
    <div class="settings-menu-dropdown" id="settingsMenuDropdown">
        <div class="settings-group">
            <p class="settings-label">Theme</p>
            <button class="settings-option" data-theme="light">Light</button>
            <button class="settings-option" data-theme="dark">Dark</button>
        </div>
        <div class="settings-group">
            <p class="settings-label">Text Size</p>
            <button class="settings-option" data-textsize="small">Small</button>
            <button class="settings-option" data-textsize="normal">Normal</button>
            <button class="settings-option" data-textsize="large">Large</button>
        </div>
    </div>
</div>
        <a href="index.html" class="active">Home</a>
        <a href="resources.html">Resources</a>
        <a href="group-finder.html">Find a group</a>
    </div>   
</nav>

    <main class="container">
        <section class="split-layout">
            <div class="split-panel panel-resources">
                <h2>Resource Library</h2>
                <p>Study materials.</p>
                <a href="resources.html" class="panel-btn">View resources</a>
            </div>
            <div class="split-panel panel-finder">
                <h2>Group Finder</h2>
                <p>Find a study group.</p>
                <a href="group-finder.html" class="panel-btn">Find a group</a>
            </div>
        </section>
 
     <section class="subject-section">
    <h3 class="section-title">My subjects</h3>
    <div class="subject-grid">
        <a href="math.html" class="subject-card border-math">
            <span class="subject-name">Mathematics</span>
            <span class="subject-code">MATH</span>
        </a>
        <a href="biology.html" class="subject-card border-bio">
            <span class="subject-name">Biology</span>
            <span class="subject-code">BIOL</span>
        </a>
        <a href="history.html" class="subject-card border-history">
            <span class="subject-name">History</span>
            <span class="subject-code">HIST</span>
        </a>
        <a href="english.html" class="subject-card border-lit">
            <span class="subject-name">English</span>
            <span class="subject-code">ENGL</span>
        </a>
        <a href="physics.html" class="subject-card border-physics">
            <span class="subject-name">Physics</span>
            <span class="subject-code">PHYS</span>
        </a>
        <a href="chemistry.html" class="subject-card border-chem">
            <span class="subject-name">Chemistry</span>
            <span class="subject-code">CHEM</span>
        </a>
        <a href="economics.html" class="subject-card border-econ">
            <span class="subject-name">Economics</span>
            <span class="subject-code">ECON</span>
        </a>
        <a href="geography.html" class="subject-card border-geo">
            <span class="subject-name">Geography</span>
            <span class="subject-code">GEOG</span>
        </a>
    </div>
</section>

    <script src="js/main.js"></script>
</body>
</html>
