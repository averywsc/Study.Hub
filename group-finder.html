<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <nav class="navbar">
    <a href="index.html" class="nav-logo">STUDENT HUB</a>
    <div class="nav-links">
        <div class="theme-menu">
            <button id="themeMenuBtn" class="theme-menu-btn">Theme</button>
            <div class="theme-menu-dropdown" id="themeMenuDropdown">
                <button class="theme-option" data-theme="light">Light</button>
                <button class="theme-option" data-theme="dark">Dark</button>
            </div>
        </div>
        <a href="index.html" class="active">Home</a>
        <a href="resources.html">Resources</a>
        <a href="group-finder.html">Find a group</a>
    </div>
</nav>

    <main class="container">
        <header class="page-header header-finder">
            <h1>Group Finder</h1>
            <p>Join or post a group.</p>
        </header>

        <section class="listings-section">
            <h2 class="resource-subheading">Available Groups</h2>

            <div class="filter-bar">
                <select id="levelFilter">
                    <option value="all">All Levels</option>
                    <option value="L2">Level 2</option>
                    <option value="L3">Level 3</option>
                </select>
                <select id="modeFilter">
                    <option value="all">All Modes</option>
                    <option value="online">Online</option>
                    <option value="in-person">In Person</option>
                </select>
            </div>

            <div class="listing-grid" id="listingGrid"></div>
        </section>

        <section class="timer-section">
            <h2 class="resource-subheading">Study Timer</h2>
            <div class="timer-box">
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-label" id="timerLabel">Focus Session</div>

                <div class="timer-settings">
                    <label>
                        Focus (min)
                        <input type="number" id="focusInput" value="25" min="0" max="90">
                    </label>
                    <label>
                        Focus (sec)
                        <input type="number" id="focusSecInput" value="0" min="0" max="59">
                    </label>
                    <label>
                        Break (min)
                        <input type="number" id="breakInput" value="5" min="0" max="30">
                    </label>
                    <label>
                        Break (sec)
                        <input type="number" id="breakSecInput" value="0" min="0" max="59">
                    </label>
                </div>

                <div class="timer-controls">
                    <button class="timer-btn timer-btn-primary" id="timerStartBtn">Start</button>
                    <button class="timer-btn" id="timerPauseBtn">Pause</button>
                    <button class="timer-btn" id="timerResetBtn">Reset</button>
                </div>
            </div>
        </section>

        <section class="prompt-section">
            <h2 class="resource-subheading">Discussion Prompts</h2>
            <div class="prompt-subject-select">
                <label for="promptSubject">Choose a subject</label>
                <select id="promptSubject">
                    <option value="math">Mathematics</option>
                    <option value="biology">Biology</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="history">History</option>
                    <option value="geography">Geography</option>
                    <option value="economics">Economics</option>
                    <option value="english">English</option>
                </select>
            </div>
            <div class="prompt-grid" id="promptGrid"></div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
