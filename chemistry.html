<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry - Student Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-subject="chemistry">
    <nav class="navbar">
        <a href="index.html" class="nav-logo">STUDENT HUB</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="resources.html">Resources</a>
            <a href="group-finder.html">Find a group</a>
            <div class="settings-menu">
                <button id="settingsMenuBtn" class="settings-menu-btn">
                    <span>Settings</span>
                </button>
                <div class="settings-menu-dropdown" id="settingsMenuDropdown">
                    <div class="settings-group">
                        <p class="settings-label">Theme</p>
                        <button class="settings-option" data-theme="light">Light</button>
                        <button class="settings-option" data-theme="dark">Dark</button>
                    </div>
                    <div class="settings-group">
                        <p class="settings-label">Text Size</p>
                        <button class="settings-option" data-textsize="small">Small</button>
                        <button class="settings-option" data-textsize="normal">Normal</button>
                        <button class="settings-option" data-textsize="large">Large</button>
                    </div>
                    <div class="settings-group">
                        <p class="settings-label">Font</p>
                        <button class="settings-option" data-font="default">Default</button>
                        <button class="settings-option" data-font="dyslexic">Dyslexic-friendly</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <a href="javascript:history.back()" class="back-btn">← Back</a>

    <main class="container">
        <header class="subject-header border-chem">
            <h1>Chemistry</h1>
            <p class="subject-standard-tag">Select a standard below to view its notes and practice material.</p>
        </header>

        <a href="#practiceSection" class="jump-link">↓ Jump to Practice Material</a>

        <section class="standard-select-section">
            <label for="standardSelect" class="standard-select-label">Standard</label>
            <select id="standardSelect" class="standard-select">
                <option value="AS91164">AS91164</option>
                <option value="AS91165">AS91165</option>
                <option value="AS91166">AS91166</option>
            </select>
        </section>

        <section class="notes-section">
            <h2 class="resource-subheading">Key Notes</h2>
            <div class="notes-card" id="notesCard"></div>
        </section>

        <section class="practice-section" id="practiceSection">
            <h2 class="resource-subheading">Practice Material</h2>
            <div class="practice-buttons" id="practiceButtons"></div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
